name: 'PlanetScale Auth'
description: 'Authenticate to the PlanetScale API with OpenID Connect'
author: 'PlanetScale'
inputs:
  organization:
    required: true
    description: 'The name of the PlanetScale organization that owns the OIDC trust.'
  oidc-trust:
    required: true
    description: 'The ID of the PlanetScale OIDC trust to authenticate with.'
outputs:
  service-token-id:
    description: 'The ID of the created PlanetScale service token.'
  service-token:
    description: 'The created PlanetScale service token.'
runs:
  using: 'node24'
  main: 'dist/index.js'
