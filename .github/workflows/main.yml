name: 🧪

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Bundle
      run: npm run pack
    - name: Validate dist is up to date
      run: |
        if [ -n "$(git status --porcelain dist)" ]; then
          echo "::error::dist/ is out of date. Run \`npm run pack\` and commit the result."
          git status --porcelain dist
          git diff dist
          exit 1
        fi

  main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Run Action
      id: auth
      uses: ./
      with:
        organization: ${{ vars.PLANETSCALE_ORGANIZATION }}
        oidc-trust: ${{ vars.PLANETSCALE_OIDC_TRUST_ID }}
    - name: Read organization
      env:
        ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
        SERVICE_TOKEN_ID: ${{ steps.auth.outputs.service-token-id }}
        SERVICE_TOKEN: ${{ steps.auth.outputs.service-token }}
      run: |
        curl --fail-with-body --silent --show-error \
          --header "Authorization: $SERVICE_TOKEN_ID:$SERVICE_TOKEN" \
          --header "Accept: application/json" \
          "https://api.planetscale.com/v1/organizations/$ORGANIZATION" \
          | jq '{name, created_at}'
