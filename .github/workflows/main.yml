name: 🧪

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  check-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Bundle
      run: npm run pack
    - name: Validate dist is up to date
      run: |
        if [ -n "$(git status --porcelain dist)" ]; then
          echo "::error::dist/ is out of date. Run \`npm run pack\` and commit the result."
          git status --porcelain dist
          git diff dist
          exit 1
        fi

  verify-licenses:
    name: Verify Dependency Licenses
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1.299.0
      with:
        ruby-version: "4"
    - run: gem install license_finder -v 7.1 # zizmor: ignore[adhoc-packages]
    - name: Install dependencies
      run: npm ci
    - name: Verify licenses
      run: license_finder

  main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Run Action
      id: auth
      uses: ./ # zizmor: ignore[self-repository]
      with:
        organization: ${{ vars.PLANETSCALE_ORGANIZATION }}
        oidc-trust: ${{ vars.PLANETSCALE_OIDC_TRUST_ID }}
    - name: Read organization
      env:
        ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
        SERVICE_TOKEN_ID: ${{ steps.auth.outputs.service-token-id }}
        SERVICE_TOKEN: ${{ steps.auth.outputs.service-token }}
      run: |
        curl --fail-with-body --silent --show-error \
          --header "Authorization: $SERVICE_TOKEN_ID:$SERVICE_TOKEN" \
          --header "Accept: application/json" \
          "https://api.planetscale.com/v1/organizations/$ORGANIZATION" \
          | jq '{name, created_at}'
