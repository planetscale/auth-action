name: GitHub Actions Security

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          inputs: .github/
          advanced-security: false
